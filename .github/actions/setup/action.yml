# Shared steps to set up the Emacs environment for CI.
---
name: Setup dev environment
description: Installs Emacs, Eask, Eask dependencies, and other npm packages
inputs:
  emacs-version:
    description: >-
      Emacs version to install, as accepted by purcell/setup-emacs. Any version named in
      https://github.com/purcell/nix-emacs-ci works, plus "release-snapshot" (current release-branch
      pretest) and "snapshot" (master).
    required: false
    default: "30.1"
runs:
  using: composite
  steps:
    # Eask dependencies are installed via an npm postinstall hook, so Emacs needs to be installed
    # first.
    - name: Setup Emacs
      uses: purcell/setup-emacs@8415786a52b3a84babd7ffc92a802b06e3780c17
      with:
        version: ${{ inputs.emacs-version }}

    # Install python for elisp-autofmt invocations.
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "lts/*"
        cache: npm

    - name: Install npm dependencies
      run: npm ci
      shell: bash
