# Shared steps to set up the Emacs environment for CI.
---
name: Setup dev environment
description: Installs Emacs, Eask, Eask dependencies, and other npm packages
inputs:
  emacs-version:
    description: >-
      Emacs version to install, as accepted by purcell/setup-emacs. Any version named in
      https://github.com/purcell/nix-emacs-ci works, plus "release-snapshot" (current release-branch
      pretest) and "snapshot" (master). The default should match the dev container's Emacs, since
      elisp-autofmt's output depends on the Emacs version.
    required: false
    default: "31.1"
runs:
  using: composite
  steps:
    # Eask dependencies are installed via an npm postinstall hook, so Emacs needs to be installed
    # first.
    - name: Setup Emacs
      uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
      with:
        version: ${{ inputs.emacs-version }}

    # Install python for elisp-autofmt invocations.
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "lts/*"
        cache: npm

    - name: Install npm dependencies
      run: npm ci
      shell: bash
