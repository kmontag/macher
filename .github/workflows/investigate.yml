# Temporary: replaces the PR checks while investigating why installing gptel fails under Emacs
# 30.1 with eask 0.12. Every step runs regardless of earlier failures, so one run answers all the
# questions at once. See .github/investigate/diag.el.
---
name: Investigate Emacs 30.1 install
on:
  pull_request:

jobs:
  investigate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ["30.1", "31.1"]
    name: investigate (emacs ${{ matrix.emacs-version }})
    env:
      DIAG: ${{ github.workspace }}/.github/investigate/diag.el
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: ${{ matrix.emacs-version }}

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install npm packages without the eask postinstall
        run: npm ci --ignore-scripts

      # A: what package.el plans to install for gptel, and which compat the archives offer. Round 1
      # showed MELPA's transient needs compat 31.1, nothing installed it, and transient then failed
      # to load with `static-when' void.
      - name: "A: package.el plan and install for gptel"
        continue-on-error: true
        env:
          DIAG_MODE: install
          DIAG_ELPA: /tmp/elpa-a
          DIAG_PACKAGES: gptel
        run: emacs --batch -l "$DIAG"

      # F: compat installed explicitly first, then gptel.
      - name: "F: package.el installs compat, then gptel"
        continue-on-error: true
        env:
          DIAG_MODE: install
          DIAG_ELPA: /tmp/elpa-f
          DIAG_PACKAGES: compat gptel
        run: emacs --batch -l "$DIAG"

      - name: "F: load the result in a fresh process"
        continue-on-error: true
        env:
          DIAG_MODE: load
          DIAG_ELPA: /tmp/elpa-f
        run: emacs --batch -l "$DIAG"

      # G: candidate fix. Declare compat 31.1 in the Eask file ahead of gptel, then do what CI does.
      - name: "G: Eask depends on compat 31.1, then npm ci"
        continue-on-error: true
        run: |
          rm -rf .eask
          sed -i 's/^(depends-on "gptel"/(depends-on "compat" "31.1")\n(depends-on "gptel"/' Eask
          grep -n depends-on Eask
          npm ci

      - name: "G: load the result in a fresh process"
        continue-on-error: true
        env:
          DIAG_MODE: load
        run: DIAG_ELPA="$PWD/.eask/${{ matrix.emacs-version }}/elpa" emacs --batch -l "$DIAG"

      - name: "G: make compile analyze test.unit"
        continue-on-error: true
        run: make compile analyze test.unit
