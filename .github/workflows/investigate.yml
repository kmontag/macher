# Temporary: replaces the PR checks while investigating why installing gptel fails under Emacs
# 30.1 with eask 0.12. Every step runs regardless of earlier failures, so one run answers all the
# questions at once. See .github/investigate/diag.el.
---
name: Investigate Emacs 30.1 install
on:
  pull_request:

jobs:
  investigate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ["30.1", "31.1"]
    name: investigate (emacs ${{ matrix.emacs-version }})
    env:
      DIAG: ${{ github.workspace }}/.github/investigate/diag.el
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: ${{ matrix.emacs-version }}

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install npm packages without the eask postinstall
        run: npm ci --ignore-scripts

      # Round 2 showed that under 30.1 package.el counts the built-in compat as satisfying
      # transient's compat 31.1 requirement, so it never installs GNU ELPA's compat 31.1, and
      # `package-install' and eask both skip compat as "already installed".
      #
      # H: candidate fix. Force GNU ELPA's compat into eask's package directory by descriptor, then
      # run the unmodified eask install the way CI does, and the checks CI runs.
      - name: "H: force-install compat, then npm ci"
        continue-on-error: true
        run: |
          rm -rf .eask
          DIAG_MODE=install DIAG_FORCE=compat \
            DIAG_ELPA="$PWD/.eask/${{ matrix.emacs-version }}/elpa" emacs --batch -l "$DIAG"
          npm ci

      - name: "H: load the result in a fresh process"
        continue-on-error: true
        env:
          DIAG_MODE: load
        run: DIAG_ELPA="$PWD/.eask/${{ matrix.emacs-version }}/elpa" emacs --batch -l "$DIAG"

      - name: "H: make compile analyze test.unit"
        continue-on-error: true
        run: make compile analyze test.unit
