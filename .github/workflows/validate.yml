---
name: Lint & Test
on:
  # Allow this workflow to be called from other workflows. See
  # https://stackoverflow.com/questions/58457140/dependencies-between-workflows-on-github-actions.
  workflow_call:
  pull_request:
  push:
    branches: ["main"]

# Cancel in-progress jobs on PRs when new commits are pushed.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  # Only cancel concurrent requests when we're running from a PR; otherwise, behavior is generally
  # more predictable if we allow existing jobs (e.g. validation triggered during release) to
  # complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Check formatting
        run: make format.check

      - name: Lint
        run: make lint

  prepare:
    runs-on: ubuntu-latest
    outputs:
      emacs-versions: ${{ steps.versions.outputs.emacs-versions }}
    steps:
      - id: versions
        run: |
          # "release-snapshot" is the pretest build of the current release branch (Emacs 31 as of
          # writing). There's no tagged Emacs 31 in nix-emacs-ci yet; swap this for the version
          # number once one exists.
          echo "emacs-versions=[\"30.1\",\"release-snapshot\"]" >> "$GITHUB_OUTPUT"

  compile:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ${{ fromJson(needs.prepare.outputs.emacs-versions) }}
    name: compile (emacs ${{ matrix.emacs-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          emacs-version: ${{ matrix.emacs-version }}

      - name: Check for compilation errors
        run: make compile

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ${{ fromJson(needs.prepare.outputs.emacs-versions) }}
    name: test (emacs ${{ matrix.emacs-version }})
    permissions:
      contents: read
      models: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          emacs-version: ${{ matrix.emacs-version }}

      # If GitHub Models are down due to rate limiting or service issues, functional tests can fall
      # back to using ollama, it'll just be rather slow.
      - name: Check GitHub Models availability
        id: check-github-models
        continue-on-error: true
        run: |
          # Test if GitHub Models API is accessible by sending a minimal request.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"test"}],"model":"gpt-4o-mini","max_tokens":1}' \
            "https://models.github.ai/inference/chat/completions")

          if [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "500" ]; then
            echo "GitHub Models API returned $HTTP_CODE, will fall back to Ollama"
            echo "available=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "GitHub Models API is available (HTTP $HTTP_CODE)"
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      # Note this also starts the ollama server.
      - name: Install Ollama
        if: steps.check-github-models.outputs.available == 'false'
        uses: ai-action/setup-ollama@v1

      # See https://github.com/ai-action/setup-ollama/issues/40.
      - name: Cache Ollama
        if: steps.check-github-models.outputs.available == 'false'
        id: cache-artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama

      - name: Pull Ollama model
        if: steps.check-github-models.outputs.available == 'false'
        run: |
          MODEL_NAME=$(grep -o 'ollama-model "[^"]*"' tests/test-functional.el | cut -d'"' -f2)
          ollama pull "$MODEL_NAME"

      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable GitHub Models in tests if the API is not available.
          MACHER_DISABLE_GITHUB_MODELS: ${{ steps.check-github-models.outputs.available == 'false' && '1' || '' }}
        run: make test
