---
name: Lint & Test
on:
  # Allow this workflow to be called from other workflows. See
  # https://stackoverflow.com/questions/58457140/dependencies-between-workflows-on-github-actions.
  workflow_call:
  pull_request:
  push:
    branches: ["main"]

# Cancel in-progress jobs on PRs when new commits are pushed.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  # Only cancel concurrent requests when we're running from a PR; otherwise, behavior is generally
  # more predictable if we allow existing jobs (e.g. validation triggered during release) to
  # complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check formatting
        run: make format.check

      - name: Lint
        run: make lint

  prepare:
    runs-on: ubuntu-latest
    outputs:
      emacs-versions: ${{ steps.versions.outputs.emacs-versions }}
    steps:
      - id: versions
        run: |
          # "release-snapshot" is the pretest build of the current release branch (Emacs 31 as of
          # writing). There's no tagged Emacs 31 in nix-emacs-ci yet; swap this for the version
          # number once one exists.
          echo "emacs-versions=[\"30.1\",\"release-snapshot\"]" >> "$GITHUB_OUTPUT"

  compile:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ${{ fromJson(needs.prepare.outputs.emacs-versions) }}
    name: compile (emacs ${{ matrix.emacs-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          emacs-version: ${{ matrix.emacs-version }}

      - name: Check for compilation errors
        run: make compile

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ${{ fromJson(needs.prepare.outputs.emacs-versions) }}
    name: test (emacs ${{ matrix.emacs-version }})
    permissions:
      contents: read
    # Replaces the timeout the retry action used to impose, so a wedged model server can't
    # keep the job alive for the default six hours.
    timeout-minutes: 20
    env:
      # The functional tests need a real LLM, so CI runs one on the runner itself. The
      # image and the model are pinned together: the flags below are parsed by that image,
      # and they have changed under us before (`--reasoning off` used to be spelled
      # `--chat-template-kwargs '{"enable_thinking":false}'`, which it now rejects as
      # deprecated).
      LLAMA_IMAGE: ghcr.io/ggml-org/llama.cpp:server@sha256:970168341efef973da5666ea5c362fa428ee66ba0dfa621b0f69bf3feb3320f7
      LLAMA_MODEL: unsloth/Qwen3-0.6B-GGUF:Q4_K_M
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          emacs-version: ${{ matrix.emacs-version }}

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llama-cache
          key: llama-${{ env.LLAMA_MODEL }}

      # A 0.6B model running on the runner's CPU is enough for these tests: the prompts are
      # trivial and the assertions only check that the right tool was called with the right
      # arguments.
      #
      # Two flags carry most of the weight:
      #
      # - `--reasoning off`, because Qwen3 is a hybrid-thinking model. Without it every tool
      #   call is preceded by ~90 tokens of thinking, which also leak into the message
      #   content. Generation dominates once the prompt is cached, so this is the difference
      #   between roughly 2 and 10 seconds per request.
      #
      # - `--cache-reuse`, because a macher request is ~3700 tokens of which ~95% is the tool
      #   definitions, identical from one request to the next. Reusing that prefix means it
      #   is prefilled once for the whole suite instead of once per request.
      - name: Start the model server
        run: |
          mkdir -p "$RUNNER_TEMP/llama-cache"
          docker run -d --name llama -p 8080:8080 \
            -e HF_HOME=/cache/hf \
            -v "$RUNNER_TEMP/llama-cache:/cache" \
            "$LLAMA_IMAGE" \
            -hf "$LLAMA_MODEL" \
            --jinja --reasoning off \
            --ctx-size 8192 --cache-reuse 256 \
            --host 0.0.0.0 --port 8080
          # On a cache miss the server downloads the model before it starts listening.
          for _ in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "model server ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The model server did not become ready."
          docker logs llama
          exit 1

      - name: Run tests
        env:
          MACHER_TEST_OPENAI_BASE_URL: http://127.0.0.1:8080/v1
          # llama-server needs no key, and serves whatever model it was started with
          # regardless of the name the request asks for.
          MACHER_TEST_OPENAI_KEY: unused
          MACHER_TEST_OPENAI_MODEL: qwen3-0.6b
          # Every spec is expected to run here, so a spec that skips itself - the
          # functional tests do that when they can't see an endpoint - fails the job
          # rather than passing quietly. See `macher-test-require-all-specs'.
          MACHER_TEST_REQUIRE_ALL_SPECS: "1"
        run: make test
